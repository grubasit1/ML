<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awake or Asleep Detector</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; background: #111; color: #eee; margin: 0; padding: 20px; }
  button { font-size: 18px; padding: 10px 24px; border: 0; border-radius: 8px; background: #4caf50; color: #fff; cursor: pointer; }
  input { width: 90%; max-width: 500px; padding: 8px; font-size: 14px; border-radius: 6px; border: 1px solid #555; background: #222; color: #eee; margin-bottom: 10px; }
  #webcam-container { margin: 20px auto; }
  #status { font-size: 48px; font-weight: bold; margin: 20px 0; min-height: 60px; }
  #label-container div { font-size: 18px; margin: 4px; }
  #message { color: #ffb74d; margin: 10px auto; max-width: 600px; font-size: 16px; }
  #message.error { color: #ef5350; }
</style>
</head>
<body>
  <h1>Awake or Asleep Detector</h1>
  <p>Trained with Teachable Machine</p>

  <p>Model link or folder:</p>
  <input type="text" id="model-url" value="./my_model/"><br>
  <button type="button" id="start-btn">Start</button>
  <div id="message"></div>

  <div id="webcam-container"></div>
  <div id="status"></div>
  <div id="label-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.4/dist/teachablemachine-image.min.js"></script>
  <script>
    let model, webcam, labelContainer, maxPredictions;
    let audioCtx, lastBeep = 0, running = false;

    function showMessage(text, isError) {
      const el = document.getElementById("message");
      el.textContent = text;
      el.className = isError ? "error" : "";
    }

    // Plays a short beep sound
    function beep() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = 880;
      gain.gain.value = 0.3;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    async function init() {
      if (running) return;

      if (typeof tmImage === "undefined" || typeof tf === "undefined") {
        showMessage("The Teachable Machine libraries did not load. Check your internet connection and refresh the page.", true);
        return;
      }

      // Audio must be started from a button click, so we do it here
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        console.log("Audio not available", e);
      }

      let base = document.getElementById("model-url").value.trim();
      if (!base.endsWith("/")) base += "/";

      // Step 1: load the model
      showMessage("Loading model...", false);
      try {
        model = await tmImage.load(base + "model.json", base + "metadata.json");
        maxPredictions = model.getTotalClasses();
      } catch (e) {
        console.error(e);
        showMessage("Could not load the model from \"" + base + "\". Make sure the files model.json, metadata.json and weights.bin are in that folder, or paste your Teachable Machine link in the box above (it ends with a slash). Details: " + e.message, true);
        return;
      }

      // Step 2: start the webcam
      showMessage("Starting webcam... click Allow when the browser asks.", false);
      try {
        webcam = new tmImage.Webcam(300, 300, true);
        await webcam.setup();
        await webcam.play();
      } catch (e) {
        console.error(e);
        showMessage("Could not start the webcam. Allow camera access in the browser (click the camera icon in the address bar) and make sure no other app is using the camera. Details: " + e.message, true);
        return;
      }

      running = true;
      showMessage("", false);
      document.getElementById("start-btn").disabled = true;
      document.getElementById("webcam-container").appendChild(webcam.canvas);
      labelContainer = document.getElementById("label-container");
      for (let i = 0; i < maxPredictions; i++) {
        labelContainer.appendChild(document.createElement("div"));
      }
      window.requestAnimationFrame(loop);
    }

    async function loop() {
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      let best = prediction[0];
      for (let i = 0; i < maxPredictions; i++) {
        labelContainer.childNodes[i].textContent =
          prediction[i].className + ": " + (prediction[i].probability * 100).toFixed(0) + "%";
        if (prediction[i].probability > best.probability) best = prediction[i];
      }
      const status = document.getElementById("status");
      status.textContent = best.className.toUpperCase();
      const asleep = best.className.toLowerCase().includes("sleep");
      status.style.color = asleep ? "#64b5f6" : "#81c784";

      // Beep once per second while the model is at least 80% sure you are asleep
      if (asleep && best.probability > 0.8 && audioCtx && Date.now() - lastBeep > 1000) {
        beep();
        lastBeep = Date.now();
      }
    }

    document.getElementById("start-btn").addEventListener("click", init);
  </script>
</body>
</html>
